name: Deploy Azure Function

# Deploys application code only (no infra). Runs automatically on pushes to main
# that touch the app, behind a build + test gate so broken code never ships.
# Infrastructure is provisioned separately and manually by infra.yml.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'host.json'
      - 'tsconfig.json'
      - '.funcignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Stamp the commit and build time into src/buildInfo.ts so /api/health
      # shows what is deployed. This only changes the file on the runner. It is
      # not committed back to the repo.
      - name: Stamp build info
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          printf 'export const buildInfo = {\n  commit: "%s",\n  builtAt: "%s"\n};\n' "$COMMIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > src/buildInfo.ts
          cat src/buildInfo.ts

      # Gate: stop the deploy if the code doesn't compile or the tests fail.
      # Oryx rebuilds on the server (remote-build below). This step is only a
      # safety check that runs before anything is deployed.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy function package
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.FUNCTION_APP_NAME }}
          package: '.'
          remote-build: true
          # Exclude local node_modules/dist from the zip so Oryx installs dependencies itself.
          respect-funcignore: true
